REMAP = M6 modalgroup=6 ngc=toolchange
FEATURES = 12


[EMCMOT]
EMCMOT = motmod num_extrajoints=3
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HMOT]
# **** This is for info only ****
CARD0=hm2_7i92.0

[HAL]
HALUI = halui
HALFILE = mazakv3.hal
HALFILE = custom.hal
HALFILE = spindle_stepgen.hal
HALFILE = 1extrajoint.hal
HALFILE = toolchanger.hal
# Fake clamp sensors - disabled 2026-10-19, real sensors back on 7i70 input-18/19
#HALFILE = sim_clamp_sensors.hal
HALFILE = pallet.hal
HALFILE = mpg.hal
HALFILE = frontpanel.hal


POSTGUI_HALFILE = custom_postgui.hal
SHUTDOWN = shutdown.hal

[HALUI]
# index 00 = Measure Tools button on the side panel (toolmeasure_postgui.hal)
MDI_COMMAND = o<.toolsensor>call

[KINS]
JOINTS = 8
KINEMATICS = trivkins coordinates=XYZAB kinstype=both




[TRAJ]
COORDINATES =  XYZAB
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.50
MAX_LINEAR_VELOCITY = 100
POSITION_FILE = position.txt
NO_FORCE_HOMING = 1

[ATC]
# toolchange Y height in MACHINE coords (G53), mm.  sub_progs/toolchange.ngc reads
# this too.  27.2846 = G54 Y0.25 as set on 2026-10-14 (G54 Y = 27.0346); G54 changes per job,
# so never use a work offset for the toolchange height.
TC_Y = 27.2846
# arm won't run unless Y is within this of TC_Y
TC_Y_TOL = 0.05
# toolchange Z position in MACHINE coords (G53), mm - set 2026-10-19 by jogging
# the arm onto a tool.  The M6 remap moves Z here before Y.
TC_Z = 17.4996
# arm won't run unless Z is within this of TC_Z
TC_Z_TOL = 0.05
# seconds any one arm step may take before it faults
STEP_TIMEOUT = 10
# shifter change position (arm side) and carousel position, in J7 units.
# Set up with the trims on the Toolchanger panel tab, then copy the
# "= ..." result here and put the trim back to 0.  (Were fixed in mag.comp.)
SHIFTER_ATC_POS = 197
SHIFTER_MAG_POS = -757

[EMCIO]
EMCIO = iov2
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
RANDOM_TOOLCHANGER = 1
# 1 = the built-in M6 does NOT stop the spindle itself.  Its hidden spindle
# stop cleared spindle.0.locked and released the M19 lock before the atc
# interlock check.  The M6 remap (sub_progs/toolchange.ngc) does its own M5
# before M19, so the spindle is still stopped for every change.
TOOL_CHANGE_WITH_SPINDLE_ON = 1

