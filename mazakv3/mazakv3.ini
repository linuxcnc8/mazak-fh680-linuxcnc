# 2048 PPR motor encoder (1:1 in high gear) = 8192 counts/rev, measured 2026-10-14.
# Negative: the encoder counts down when the spindle turns CW (M3).
ENCODER_SCALE = -8192
OUTPUT_SCALE = 10000
OUTPUT_MIN_LIMIT = -10000
OUTPUT_MAX_LIMIT = 10000

# --- VFD step/dir output, hm2_7i92.0.stepgen.03 (spindle_stepgen.hal) ---
# Drive pulses per rev.  Drive gear L3.07/L3.08 = 2/1 makes it 1024
# (at 1/1 one pulse = one encoder line = 2048/rev).  0.35 deg per pulse.
# Positive = M3 turns the spindle CW (checked 2026-10-14).
STEP_SCALE = 1024
# rev/sec ceiling: 25 rev/s = 1500 RPM (25.6 kHz pulse rate)
STEPGEN_MAXVEL = 25
# rev/sec^2 ramp: 10 = 2.5 s from stop to 1500 RPM (VFD has its own ramp too)
STEPGEN_MAXACCEL = 10
# nanoseconds.  STEPLEN + STEPSPACE = 10 us -> 100 kHz ceiling, plenty of
# margin over the 25.6 kHz needed at 1500 RPM.
DIRSETUP   = 20000
DIRHOLD    = 20000
STEPLEN    = 5000
STEPSPACE  = 5000

# RPM limits motion enforces on S words and the override knob
MAX_FORWARD_VELOCITY = 1500
MAX_REVERSE_VELOCITY = 1500

# --- M19 orient, spindle_orient.comp (spindle_stepgen.hal) ---
# degrees added to M19 R: encoder index -> tool key.  318.5 found 2026-10-14,
# so M19 R0 = toolchange position.
ORIENT_OFFSET = 318.5
# stepgen units per spindle rev while the drive is in position mode.
# 1 if the drive takes STEP_SCALE pulses/rev in both modes.
ORIENT_POS_RATIO = 1
# rev/s while looking for the index (1 = 60 RPM)
ORIENT_SEARCH_VEL = 1
# rev/s and rev/s^2 for the orient move
ORIENT_MOVE_VEL = 1
ORIENT_MOVE_ACCEL = 5
# degrees either side of the target (one pulse = 0.35 deg)
ORIENT_TOLERANCE = 0.5
# seconds after a move before trying a correction (drive needs ~1 s to settle)
ORIENT_RETRY_WAIT = 1
# seconds X1 (drive enable) stays on after the spindle has stopped, then free
RELEASE_DELAY = 1
# 1 = re-find the encoder index on every M19 and report index-drift
ORIENT_ALWAYS_INDEX = TRUE
# seconds for the mode relay + drive to switch
ORIENT_MODE_DELAY = 0.2
# seconds for the whole orient before orient-fault
ORIENT_TIMEOUT = 15
