[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.025
USER_M_PATH = /home/cnc/linuxcnc/configs/mazak/mazakv3/subs/
SUBROUTINE_PATH = /home/cnc/linuxcnc/configs/mazak/mazakv3/sub_progs/
